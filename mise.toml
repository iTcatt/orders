[env]
APP_ENV = "dev"
JAVA_HOME = "/Library/Java/JavaVirtualMachines/temurin-24.jdk/Contents/Home"

[tools]
"aqua:tsenart/vegeta" = "latest"
go = "1.26.0"
"go:github.com/pressly/goose/v3/cmd/goose" = "latest"
golangci-lint = "v2.10.1"

[tasks.fmt]
run = "golangci-lint fmt"

[tasks.lint]
run = "golangci-lint run"

[tasks.test]
run = "go test -v ./..."

[tasks.start]
run = "go run cmd/service/main.go"

[tasks.mocks]
run = "mockery"

[tasks.check]
depends = ["fmt", "lint"]

[tasks.install_ijhttp]
run = "brew install ijhttp"

[tasks.httptest]
run = "ijhttp --env-file http/http-client.env.json -e dev http/products/test.http"

[tasks."infra:up"]
description = "Start dev infrastructure (postgres, monitoring)"
run = "docker compose up --build -d"

[tasks."infra:down"]
description = "Stop dev infrastructure"
run = "docker compose down"

[tasks."prod:up"]
description = "Start production stack (app + all dependencies)"
run = "docker compose -f docker-compose.prod.yml up --build -d"

[tasks."prod:down"]
description = "Stop production stack"
run = "docker compose -f docker-compose.prod.yml down"

[tasks."prod:logs"]
description = "Follow production logs"
run = "docker compose -f docker-compose.prod.yml logs -f"
