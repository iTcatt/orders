[env]
_.file = '.env'
APP_ENV = "dev"
DB_USER = "postgres"
DB_NAME = "master"
JAVA_HOME = "/Library/Java/JavaVirtualMachines/temurin-24.jdk/Contents/Home"

[tools]
"aqua:tsenart/vegeta" = "latest"
go = "1.26.0"
"go:github.com/pressly/goose/v3/cmd/goose" = "latest"
golangci-lint = "v2.10.1"
mockery = "latest"

[tasks.fmt]
run = "golangci-lint fmt"

[tasks.lint]
run = "golangci-lint run"

[tasks.test]
run = "go test -v ./..."

[tasks.start]
run = "go run cmd/service/main.go"

[tasks.check]
depends = ["fmt", "lint"]

[tasks.migrate]
run = "goose postgres $DB_URL -dir migrations/postgres/master up"

[tasks.down]
run = "goose postgres $DB_URL -dir migrations/postgres/master down"

[tasks.install_ijhttp]
run = "brew install ijhttp"

[tasks.httptest]
run = "ijhttp --env-file http/http-client.env.json -e dev http/products/test.http"
