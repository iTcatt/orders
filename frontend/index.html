<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3e;
      --accent:    #6c63ff;
      --accent-h:  #5a52d5;
      --danger:    #e05c6e;
      --danger-h:  #c44b5c;
      --text:      #e8eaf0;
      --muted:     #7a7f9a;
      --success:   #4caf82;
      --radius:    12px;
      --shadow:    0 4px 24px rgba(0,0,0,.45);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,17,23,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -.5px; }
    header .logo span { color: var(--accent); }

    /* ── Layout ── */
    main { max-width: 1280px; margin: 0 auto; padding: 32px 24px 80px; }

    .toolbar {
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .toolbar h1 { font-size: 1.5rem; font-weight: 700; flex: 1; }
    .toolbar .count { color: var(--muted); font-size: .875rem; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; border-radius: 8px; border: none;
      font-size: .875rem; font-weight: 600; cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--border); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-h); }
    .btn-sm { padding: 6px 12px; font-size: .8rem; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: transform .2s, box-shadow .2s;
      cursor: pointer;
    }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }

    .card-image {
      aspect-ratio: 16/9;
      background: var(--border);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .card-image img {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0;
      transition: opacity .2s;
    }
    .card-image img.loaded { opacity: 1; }
    .card-image .img-placeholder {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; color: var(--muted); font-size: .8rem;
    }
    .card-image .img-placeholder svg { opacity: .4; }

    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .card-title { font-size: 1rem; font-weight: 600; line-height: 1.3; }
    .card-price {
      font-size: 1.1rem; font-weight: 700; color: var(--accent);
      margin-top: 4px;
    }

    .card-actions {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 6px;
    }
    .card-actions-row {
      display: flex; gap: 8px;
    }
    .card-actions-row .btn { flex: 1; justify-content: center; }

    /* ── Empty / Loading ── */
    .state-center {
      grid-column: 1/-1;
      display: flex; flex-direction: column; align-items: center;
      gap: 16px; padding: 80px 0; color: var(--muted);
    }
    .state-center svg { opacity: .3; }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Load more trigger ── */
    #sentinel { height: 1px; }

    /* ── Modal ── */
    .overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.65);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%; max-width: 480px;
      box-shadow: var(--shadow);
      transform: translateY(16px);
      transition: transform .2s;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }
    .overlay.open .modal { transform: translateY(0); }

    .modal-header {
      padding: 20px 24px 0;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0;
      background: var(--surface);
      z-index: 1;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; }
    .modal-close {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1.25rem; line-height: 1;
      transition: color .15s;
    }
    .modal-close:hover { color: var(--text); }

    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .modal-footer {
      padding: 0 24px 20px; display: flex; gap: 10px; justify-content: flex-end;
      position: sticky; bottom: 0;
      background: var(--surface);
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* ── Form ── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .field input, .field textarea {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px;
      color: var(--text); font-size: .9rem; font-family: inherit;
      outline: none; resize: vertical;
      transition: border-color .15s;
    }
    .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .field .hint { font-size: .75rem; color: var(--muted); }
    .field-error { font-size: .75rem; color: var(--danger); }

    /* ── Image upload zone (create) ── */
    .image-slots {
      display: flex; gap: 10px;
    }
    .image-slot {
      flex: 1; aspect-ratio: 1;
      border: 2px dashed var(--border);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .image-slot:hover { border-color: var(--accent); background: rgba(108,99,255,.06); }
    .image-slot input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .image-slot .slot-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--muted); font-size: .72rem; pointer-events: none;
    }
    .image-slot img {
      width: 100%; height: 100%; object-fit: cover;
      display: none;
      pointer-events: none;
    }
    .image-slot img.has-img { display: block; }
    .image-slot .slot-remove {
      position: absolute; top: 4px; right: 4px;
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(0,0,0,.7); border: none; cursor: pointer;
      color: #fff; font-size: .65rem; line-height: 1;
      display: none; align-items: center; justify-content: center;
      z-index: 2;
    }
    .image-slot.filled .slot-remove { display: flex; }
    .image-slot.filled .slot-placeholder { display: none; }
    .image-slot.filled { border-style: solid; border-color: var(--accent); }
    .upload-hint { font-size: .72rem; color: var(--muted); }

    /* ── Edit image items ── */
    .edit-images {
      display: flex; flex-direction: column; gap: 6px;
    }
    .edit-image-row {
      display: flex; gap: 10px; align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg);
      cursor: grab;
      transition: border-color .15s, opacity .15s;
      user-select: none;
    }
    .edit-image-row:active { cursor: grabbing; }
    .edit-image-row.drag-over {
      border-color: var(--accent);
      background: rgba(108,99,255,.08);
    }
    .edit-image-row.dragging { opacity: .4; }
    .drag-handle {
      color: var(--muted); flex-shrink: 0; line-height: 1;
      font-size: 1rem; cursor: grab;
    }
    .edit-image-thumb {
      width: 56px; height: 56px; flex-shrink: 0;
      border-radius: 6px; overflow: hidden;
      background: var(--border);
      border: 1px solid var(--border);
      position: relative;
    }
    .edit-image-thumb img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .edit-image-thumb .new-badge {
      position: absolute; bottom: 2px; left: 2px;
      background: var(--accent); color: #fff;
      font-size: .6rem; font-weight: 700;
      padding: 1px 5px; border-radius: 4px;
    }
    .edit-image-label {
      font-size: .8rem; color: var(--muted); flex: 1;
    }
    .edit-img-btn {
      padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer;
      font-size: .75rem; transition: background .15s, color .15s;
      display: flex; align-items: center; flex-shrink: 0;
    }
    .edit-img-btn:hover { background: var(--border); color: var(--text); }
    .edit-img-btn.danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    .edit-add-slot {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border: 2px dashed var(--border); border-radius: 8px;
      cursor: pointer; position: relative;
      transition: border-color .15s, background .15s;
    }
    .edit-add-slot:hover { border-color: var(--accent); background: rgba(108,99,255,.06); }
    .edit-add-slot input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .edit-add-slot-icon {
      width: 36px; height: 36px; border-radius: 6px;
      background: var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); flex-shrink: 0;
    }
    .edit-add-slot-text { font-size: .8rem; color: var(--muted); }

    /* ── Toast ── */
    .toasts {
      position: fixed; bottom: 24px; right: 24px; z-index: 500;
      display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    }
    .toast {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 16px;
      font-size: .875rem; max-width: 320px;
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 10px;
      animation: slideIn .25s ease-out;
    }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error   { border-left: 3px solid var(--danger); }
    @keyframes slideIn {
      from { transform: translateX(40px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    .toast.out { animation: slideOut .25s ease-in forwards; }
    @keyframes slideOut {
      to { transform: translateX(40px); opacity: 0; }
    }

    /* ── Confirm modal ── */
    .modal-confirm {
      max-width: 400px;
    }
    .confirm-body {
      padding: 24px 24px 8px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .confirm-icon {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .confirm-text { font-size: .95rem; line-height: 1.5; }
    .confirm-name { font-weight: 600; color: var(--text); }

    /* ── Detail modal ── */
    .modal-detail {
      max-width: 560px;
    }

    /* ── Carousel ── */
    .carousel {
      position: relative;
      background: var(--bg);
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/9;
      display: flex; align-items: center; justify-content: center;
    }
    .carousel-img {
      width: 100%; height: 100%; object-fit: contain;
      display: none;
    }
    .carousel-img.active { display: block; }
    .carousel-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      color: var(--muted); font-size: .85rem;
    }
    .carousel-placeholder svg { opacity: .3; }
    .carousel-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,.55); border: none; cursor: pointer;
      color: #fff; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
      font-size: 1rem;
    }
    .carousel-btn:hover { background: rgba(0,0,0,.8); }
    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }
    .carousel-btn:disabled { opacity: 0; pointer-events: none; }
    .carousel-counter {
      position: absolute; bottom: 8px; right: 12px;
      font-size: .72rem; color: rgba(255,255,255,.7);
      background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 20px;
    }

    /* ── Detail info ── */
    .detail-price {
      font-size: 1.4rem; font-weight: 700; color: var(--accent);
    }
    .detail-desc {
      font-size: .9rem; color: var(--muted); line-height: 1.6;
      white-space: pre-wrap;
    }
    .detail-meta { font-size: .75rem; color: var(--muted); }
  </style>
</head>
<body>

<header>
  <div class="logo">Pro<span>duct</span>s</div>
  <button class="btn btn-primary" id="btnCreate">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    Новый товар
  </button>
</header>

<main>
  <div class="toolbar">
    <h1>Каталог</h1>
    <span class="count" id="countLabel"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div id="sentinel"></div>
</main>

<!-- Create modal -->
<div class="overlay" id="formOverlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-title">Новый товар</span>
      <button class="modal-close" id="formClose" aria-label="Закрыть">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="fTitle">Название</label>
        <input id="fTitle" type="text" placeholder="Название товара" maxlength="255" />
        <span class="field-error" id="errTitle"></span>
      </div>
      <div class="field">
        <label for="fDesc">Описание</label>
        <textarea id="fDesc" rows="3" placeholder="Описание товара"></textarea>
        <span class="field-error" id="errDesc"></span>
      </div>
      <div class="field">
        <label for="fPrice">Цена (в рублях)</label>
        <input id="fPrice" type="number" min="0.01" step="0.01" placeholder="0.00" />
        <span class="hint">Будет сохранено в копейках</span>
        <span class="field-error" id="errPrice"></span>
      </div>
      <div class="field">
        <label>Фотографии (до 3)</label>
        <div class="edit-images" id="imageSlots">
          <!-- slots rendered by JS -->
        </div>
        <span class="upload-hint">JPEG, PNG или WebP, до 5 МБ каждый</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="formCancel">Отмена</button>
      <button class="btn btn-primary" id="formSubmit">Создать</button>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="overlay" id="editOverlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-title">Редактировать товар</span>
      <button class="modal-close" id="editClose" aria-label="Закрыть">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="eTitle">Название</label>
        <input id="eTitle" type="text" placeholder="Название товара" maxlength="255" />
        <span class="field-error" id="eErrTitle"></span>
      </div>
      <div class="field">
        <label for="eDesc">Описание</label>
        <textarea id="eDesc" rows="3" placeholder="Описание товара"></textarea>
        <span class="field-error" id="eErrDesc"></span>
      </div>
      <div class="field">
        <label for="ePrice">Цена (в рублях)</label>
        <input id="ePrice" type="number" min="0.01" step="0.01" placeholder="0.00" />
        <span class="hint">Будет сохранено в копейках</span>
        <span class="field-error" id="eErrPrice"></span>
      </div>
      <div class="field">
        <label>Фотографии (до 3)</label>
        <div class="edit-images" id="editImages">
          <!-- rendered by JS -->
        </div>
        <span class="upload-hint">JPEG, PNG или WebP, до 5 МБ каждый</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="editCancel">Отмена</button>
      <button class="btn btn-primary" id="editSubmit">Сохранить</button>
    </div>
  </div>
</div>

<!-- Confirm delete modal -->
<div class="overlay" id="confirmOverlay">
  <div class="modal modal-confirm" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-title" id="confirmTitle"></span>
      <button class="modal-close" id="confirmClose" aria-label="Закрыть">&#x2715;</button>
    </div>
    <div class="confirm-body">
      <div class="confirm-icon" id="confirmIcon"></div>
      <div class="confirm-text" id="confirmText"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="confirmCancel">Отмена</button>
      <button class="btn" id="confirmOk"></button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal modal-detail" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-title" id="detailTitle"></span>
      <button class="modal-close" id="detailClose" aria-label="Закрыть">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="carousel" id="carousel">
        <div class="carousel-placeholder" id="carouselPlaceholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <span>Фото нет</span>
        </div>
        <button class="carousel-btn prev" id="carouselPrev">&#8249;</button>
        <button class="carousel-btn next" id="carouselNext">&#8250;</button>
        <span class="carousel-counter" id="carouselCounter" style="display:none"></span>
      </div>
      <div class="detail-price" id="detailPrice"></div>
      <div class="detail-desc" id="detailDesc"></div>
      <div class="detail-meta" id="detailMeta"></div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
const API = '/product';
const PAGE_SIZE = 12;
const MAX_IMAGES = 3;

/* ── State ── */
let page = 1;
let loading = false;
let exhausted = false;

/* ── Create modal image state ── */
let imageFiles = [];

/* ── Edit modal state ── */
let editProductId = null;
let editOriginalProduct = null;
// Each item: null | {type:'existing', id, url} | {type:'new', file, previewUrl}
let editItems = [];

/* ── API ── */
async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: opts.body && !(opts.body instanceof FormData)
      ? { 'Content-Type': 'application/json' }
      : {},
    ...opts,
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `HTTP ${res.status}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const getProducts    = (p, lim) => apiFetch(`?page=${p}&limit=${lim}`);
const getProduct     = id => apiFetch(`/${id}`);
const createProduct  = data => apiFetch('/', { method: 'POST', body: JSON.stringify(data) });
const updateProduct  = (id, data) => apiFetch(`/${id}`, { method: 'PATCH', body: JSON.stringify(data) });
const deleteProduct  = id => apiFetch(`/${id}`, { method: 'DELETE' });
const deleteImage    = (productId, imageId) => apiFetch(`/${productId}/image/${imageId}`, { method: 'DELETE' });
const reorderImages  = (productId, positions) => apiFetch(`/${productId}/images/order`, { method: 'PUT', body: JSON.stringify(positions) });

async function uploadImage(productId, file) {
  const fd = new FormData();
  fd.append('image', file);
  return apiFetch(`/${productId}/image`, { method: 'POST', body: fd });
}

/* ── Helpers ── */
const formatPrice = kopecks => {
  const rubles = kopecks / 100;
  return rubles.toLocaleString('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 2 });
};

const formatDate = iso => new Date(iso).toLocaleDateString('ru-RU', {
  day: '2-digit', month: 'short', year: 'numeric',
});

/* ── Toast ── */
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      ${type === 'success'
        ? '<path d="M3 8l3.5 3.5L13 5" stroke="#4caf82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
        : '<path d="M4 4l8 8M12 4l-8 8" stroke="#e05c6e" stroke-width="2" stroke-linecap="round"/>'}
    </svg>
    <span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    el.addEventListener('animationend', () => el.remove());
  }, 3500);
}

/* ── Card rendering ── */
function cardHTML(p) {
  const firstImg = p.images && p.images.length > 0 ? p.images[0].url : null;
  const imgBlock = firstImg
    ? `<img src="${escAttr(firstImg)}" alt="${escAttr(p.title)}" loading="lazy" onload="this.classList.add('loaded')" />`
    : `<div class="img-placeholder">
         <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
           <rect x="3" y="3" width="18" height="18" rx="2"/>
           <circle cx="8.5" cy="8.5" r="1.5"/>
           <path d="M21 15l-5-5L5 21"/>
         </svg>
         <span>Фото скоро</span>
       </div>`;

  return `
    <div class="card" data-id="${escAttr(p.id)}" onclick="openDetail('${escAttr(p.id)}')">
      <div class="card-image">${imgBlock}</div>
      <div class="card-body">
        <div class="card-title">${escHtml(p.title)}</div>
        <div class="card-price">${formatPrice(p.price)}</div>
      </div>
      <div class="card-actions">
        <div class="card-actions-row">
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openDetail('${escAttr(p.id)}')">Подробнее</button>
        </div>
        <div class="card-actions-row">
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openEdit('${escAttr(p.id)}')">Изменить</button>
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); openDeleteConfirm('${escAttr(p.id)}', '${escAttr(p.title)}')">Удалить</button>
        </div>
      </div>
    </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

/* ── Load more ── */
async function loadMore() {
  if (loading || exhausted) return;
  loading = true;

  const grid = document.getElementById('grid');

  if (page === 1) {
    grid.innerHTML = `<div class="state-center"><div class="spinner"></div></div>`;
  }

  try {
    const products = await getProducts(page, PAGE_SIZE);

    if (page === 1) grid.innerHTML = '';

    if (!products || products.length === 0) {
      exhausted = true;
      if (page === 1) {
        grid.innerHTML = `
          <div class="state-center">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <path d="M3 6h18M3 12h18M3 18h18"/>
            </svg>
            <span>Товаров пока нет</span>
          </div>`;
      }
      return;
    }

    for (const p of products) {
      grid.insertAdjacentHTML('beforeend', cardHTML(p));
    }

    updateCount();

    if (products.length < PAGE_SIZE) exhausted = true;
    else page++;

  } catch (e) {
    toast(e.message, 'error');
    if (page === 1) grid.innerHTML = '';
  } finally {
    loading = false;
  }
}

function updateCount() {
  const n = document.querySelectorAll('.card').length;
  document.getElementById('countLabel').textContent = n ? `${n} товар${ru(n)}` : '';
}

function ru(n) {
  if (n % 10 === 1 && n % 100 !== 11) return '';
  if (n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14)) return 'а';
  return 'ов';
}

/* ── Infinite scroll ── */
const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) loadMore();
}, { rootMargin: '200px' });
observer.observe(document.getElementById('sentinel'));

/* ── Modal helpers ── */
function openOverlay(id)  { document.getElementById(id).classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }

/* ── Create image slots ── */
function renderSlots() {
  const container = document.getElementById('imageSlots');
  container.innerHTML = '';
  let dragSrcIdx = -1;

  imageFiles.forEach((file, idx) => {
    const row = document.createElement('div');
    row.className = 'edit-image-row';
    row.draggable = true;

    row.addEventListener('dragstart', e => {
      dragSrcIdx = idx;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('drag-over');
      if (dragSrcIdx === idx || dragSrcIdx === -1) return;
      const [moved] = imageFiles.splice(dragSrcIdx, 1);
      imageFiles.splice(idx, 0, moved);
      renderSlots();
    });

    const handle = document.createElement('div');
    handle.className = 'drag-handle';
    handle.innerHTML = '&#8942;&#8942;';

    const thumb = document.createElement('div');
    thumb.className = 'edit-image-thumb';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.alt = '';
    thumb.appendChild(img);

    const label = document.createElement('div');
    label.className = 'edit-image-label';
    label.textContent = `Фото ${idx + 1}`;

    const btnDel = document.createElement('button');
    btnDel.className = 'edit-img-btn danger';
    btnDel.innerHTML = '&#x2715; Удалить';
    btnDel.addEventListener('click', () => {
      imageFiles.splice(idx, 1);
      renderSlots();
    });

    row.appendChild(handle);
    row.appendChild(thumb);
    row.appendChild(label);
    row.appendChild(btnDel);
    container.appendChild(row);
  });

  if (imageFiles.length < MAX_IMAGES) {
    const addSlot = document.createElement('div');
    addSlot.className = 'edit-add-slot';

    const icon = document.createElement('div');
    icon.className = 'edit-add-slot-icon';
    icon.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
    </svg>`;

    const text = document.createElement('div');
    text.className = 'edit-add-slot-text';
    text.textContent = `Добавить фото (${imageFiles.length}/${MAX_IMAGES})`;

    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/jpeg,image/png,image/webp';
    inp.addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      imageFiles.push(f);
      renderSlots();
    });

    addSlot.appendChild(icon);
    addSlot.appendChild(text);
    addSlot.appendChild(inp);
    container.appendChild(addSlot);
  }
}

function clearImageSlots() {
  imageFiles = [];
  renderSlots();
}

/* ── Edit modal ── */
async function openEdit(id) {
  editProductId = id;
  editOriginalProduct = null;
  editItems = [];

  // Clear errors
  ['eErrTitle','eErrDesc','eErrPrice'].forEach(eid => document.getElementById(eid).textContent = '');

  openOverlay('editOverlay');
  document.getElementById('editSubmit').disabled = true;

  try {
    const p = await getProduct(id);
    editOriginalProduct = p;

    document.getElementById('eTitle').value = p.title;
    document.getElementById('eDesc').value = p.description;
    document.getElementById('ePrice').value = (p.price / 100).toFixed(2);

    editItems = (p.images || []).map(img => ({ type: 'existing', id: img.id, url: img.url }));

    renderEditImages();
    document.getElementById('editSubmit').disabled = false;
    document.getElementById('eTitle').focus();
  } catch (e) {
    toast(e.message, 'error');
    closeOverlay('editOverlay');
  }
}

function renderEditImages() {
  const container = document.getElementById('editImages');
  container.innerHTML = '';

  const filled = editItems.filter(Boolean);
  let dragSrcIdx = -1;

  filled.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'edit-image-row';
    row.draggable = true;

    row.addEventListener('dragstart', e => {
      dragSrcIdx = idx;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => {
      row.classList.remove('drag-over');
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('drag-over');
      if (dragSrcIdx === idx || dragSrcIdx === -1) return;
      const [moved] = filled.splice(dragSrcIdx, 1);
      filled.splice(idx, 0, moved);
      editItems = filled;
      renderEditImages();
    });

    // Drag handle
    const handle = document.createElement('div');
    handle.className = 'drag-handle';
    handle.innerHTML = '&#8942;&#8942;';

    // Thumbnail
    const thumb = document.createElement('div');
    thumb.className = 'edit-image-thumb';
    const img = document.createElement('img');
    img.src = item.type === 'existing' ? item.url : item.previewUrl;
    img.alt = '';
    thumb.appendChild(img);
    if (item.type === 'new') {
      const badge = document.createElement('span');
      badge.className = 'new-badge';
      badge.textContent = 'NEW';
      thumb.appendChild(badge);
    }

    // Label
    const label = document.createElement('div');
    label.className = 'edit-image-label';
    label.textContent = item.type === 'existing' ? `Фото ${idx + 1}` : `Новое фото ${idx + 1}`;

    // Delete button
    const btnDel = document.createElement('button');
    btnDel.className = 'edit-img-btn danger';
    btnDel.title = 'Удалить фото';
    btnDel.innerHTML = '&#x2715; Удалить';
    btnDel.addEventListener('click', () => {
      filled.splice(idx, 1);
      editItems = filled;
      renderEditImages();
    });

    row.appendChild(handle);
    row.appendChild(thumb);
    row.appendChild(label);
    row.appendChild(btnDel);
    container.appendChild(row);
  });

  // Add slot if under limit
  if (filled.length < MAX_IMAGES) {
    const addSlot = document.createElement('div');
    addSlot.className = 'edit-add-slot';

    const icon = document.createElement('div');
    icon.className = 'edit-add-slot-icon';
    icon.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
    </svg>`;

    const text = document.createElement('div');
    text.className = 'edit-add-slot-text';
    text.textContent = `Добавить фото (${filled.length}/${MAX_IMAGES})`;

    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/jpeg,image/png,image/webp';
    inp.addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      editItems.push({ type: 'new', file: f, previewUrl: URL.createObjectURL(f) });
      renderEditImages();
    });

    addSlot.appendChild(icon);
    addSlot.appendChild(text);
    addSlot.appendChild(inp);
    container.appendChild(addSlot);
  }
}

function validateEditForm() {
  let ok = true;
  const title = document.getElementById('eTitle').value.trim();
  const desc  = document.getElementById('eDesc').value.trim();
  const price = parseFloat(document.getElementById('ePrice').value);

  if (!title) { document.getElementById('eErrTitle').textContent = 'Обязательное поле'; ok = false; }
  else document.getElementById('eErrTitle').textContent = '';
  if (!desc)  { document.getElementById('eErrDesc').textContent = 'Обязательное поле'; ok = false; }
  else document.getElementById('eErrDesc').textContent = '';
  if (!price || price <= 0) { document.getElementById('eErrPrice').textContent = 'Укажите положительную цену'; ok = false; }
  else document.getElementById('eErrPrice').textContent = '';

  return ok;
}

document.getElementById('editSubmit').onclick = () => {
  if (!validateEditForm()) return;

  const id = editProductId;
  const orig = editOriginalProduct;
  const title = document.getElementById('eTitle').value.trim();
  const description = document.getElementById('eDesc').value.trim();
  const price = Math.round(parseFloat(document.getElementById('ePrice').value) * 100);
  const itemsSnapshot = [...editItems];

  openConfirm({
    title: 'Сохранить изменения?',
    icon: ICON_WARNING,
    iconBg: 'rgba(108,99,255,.15)',
    text: `Изменения в товаре <strong>${escHtml(title)}</strong> будут сохранены.`,
    okLabel: 'Сохранить',
    okClass: 'btn-primary',
    action: async () => {
      // 1. Update text fields if changed
      const patch = {};
      if (title !== orig.title) patch.title = title;
      if (description !== orig.description) patch.description = description;
      if (price !== orig.price) patch.price = price;
      if (Object.keys(patch).length > 0) await updateProduct(id, patch);

      // 2. Delete removed existing images
      const origIds = new Set((orig.images || []).map(img => img.id));
      const keptIds = new Set(itemsSnapshot.filter(i => i.type === 'existing').map(i => i.id));
      const toDelete = [...origIds].filter(imgId => !keptIds.has(imgId));
      for (const imgId of toDelete) {
        try { await deleteImage(id, imgId); }
        catch (err) { toast(`Не удалось удалить фото: ${err.message}`, 'error'); }
      }

      // 3. Upload new images
      const newItems = itemsSnapshot.filter(i => i.type === 'new');
      for (let i = 0; i < newItems.length; i++) {
        try {
          const res = await uploadImage(id, newItems[i].file);
          newItems[i]._uploadedId = res.id;
        } catch (err) {
          toast(`Фото ${i + 1} не загрузилось: ${err.message}`, 'error');
        }
      }

      // 4. Reorder if order or set changed
      const finalIds = itemsSnapshot
        .filter(item => item.type === 'existing' ? keptIds.has(item.id) : item._uploadedId)
        .map(item => item.type === 'existing' ? item.id : item._uploadedId)
        .filter(Boolean);
      if (finalIds.length > 0) {
        const origOrderIds = (orig.images || []).map(img => img.id);
        if (JSON.stringify(finalIds) !== JSON.stringify(origOrderIds)) {
          const positions = finalIds.map((imgId, i) => ({ id: imgId, position: i }));
          try { await reorderImages(id, positions); }
          catch (err) { toast(`Не удалось изменить порядок: ${err.message}`, 'error'); }
        }
      }

      toast('Товар обновлён');
      closeOverlay('editOverlay');
      resetAndReload();
    },
  });
};

  document.getElementById(id).onclick = () => closeOverlay('editOverlay'));

  <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>

  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>

let carouselImages = [];
let carouselIndex = 0;

async function openDetail(id) {
  openOverlay('detailOverlay');
  document.getElementById('detailTitle').textContent = '';
  document.getElementById('detailPrice').textContent = '';
  document.getElementById('detailDesc').textContent = '';
  document.getElementById('detailMeta').textContent = '';

  try {
    const p = await getProduct(id);
    document.getElementById('detailTitle').textContent = p.title;
    document.getElementById('detailPrice').textContent = formatPrice(p.price);
    document.getElementById('detailDesc').textContent = p.description;

    resetCarousel((p.images || []).map(img => img.url));
  } catch (e) {
    toast(e.message, 'error');
    closeOverlay('detailOverlay');
  }
}

function resetCarousel(urls) {
  carouselImages = urls;
  carouselIndex = 0;

  const carousel = document.getElementById('carousel');
  carousel.querySelectorAll('.carousel-img').forEach(el => el.remove());

  const placeholder = document.getElementById('carouselPlaceholder');
  const counter = document.getElementById('carouselCounter');

  if (urls.length === 0) {
    placeholder.style.display = '';
    counter.style.display = 'none';
    document.getElementById('carouselPrev').disabled = true;
    document.getElementById('carouselNext').disabled = true;
    return;
  }

  placeholder.style.display = 'none';

  for (let i = 0; i < urls.length; i++) {
    const img = document.createElement('img');
    img.className = 'carousel-img' + (i === 0 ? ' active' : '');
    img.src = urls[i];
    img.alt = '';
    carousel.insertBefore(img, document.getElementById('carouselPrev'));
  }

  updateCarousel();
}

function updateCarousel() {
  const imgs = document.querySelectorAll('#carousel .carousel-img');
  imgs.forEach((img, i) => img.classList.toggle('active', i === carouselIndex));

  const counter = document.getElementById('carouselCounter');
  if (carouselImages.length > 1) {
    counter.style.display = '';
    counter.textContent = `${carouselIndex + 1} / ${carouselImages.length}`;
  } else {
    counter.style.display = 'none';
  }

  document.getElementById('carouselPrev').disabled = carouselIndex === 0;
  document.getElementById('carouselNext').disabled = carouselIndex === carouselImages.length - 1;
}

document.getElementById('carouselPrev').onclick = () => {
  if (carouselIndex > 0) { carouselIndex--; updateCarousel(); }
};
document.getElementById('carouselNext').onclick = () => {
  if (carouselIndex < carouselImages.length - 1) { carouselIndex++; updateCarousel(); }
};

document.getElementById('detailClose').onclick = () => closeOverlay('detailOverlay');

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeOverlay('formOverlay');
    closeOverlay('editOverlay');
    closeOverlay('confirmOverlay');
    closeOverlay('detailOverlay');
  }
  if (e.key === 'ArrowLeft' && document.getElementById('detailOverlay').classList.contains('open')) {
    if (carouselIndex > 0) { carouselIndex--; updateCarousel(); }
  }
  if (e.key === 'ArrowRight' && document.getElementById('detailOverlay').classList.contains('open')) {
    if (carouselIndex < carouselImages.length - 1) { carouselIndex++; updateCarousel(); }
  }
});

/* ── Overlay backdrop click ── */
['formOverlay','editOverlay','confirmOverlay','detailOverlay'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target === e.currentTarget) closeOverlay(id);
  });
});

function resetAndReload() {

  exhausted = false;
  document.getElementById('grid').innerHTML = '';
  loadMore();
}

/* Enter to submit create form */
document.getElementById('formOverlay').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
    document.getElementById('formSubmit').click();
  }
});

/* Enter to submit edit form */
document.getElementById('editOverlay').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
    document.getElementById('editSubmit').click();
  }
});

/* ── Init ── */
renderSlots();
</script>
</body>
</html>
