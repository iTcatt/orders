<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3e;
      --accent:    #6c63ff;
      --accent-h:  #5a52d5;
      --danger:    #e05c6e;
      --danger-h:  #c44b5c;
      --text:      #e8eaf0;
      --muted:     #7a7f9a;
      --success:   #4caf82;
      --radius:    12px;
      --shadow:    0 4px 24px rgba(0,0,0,.45);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,17,23,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -.5px; }
    header .logo span { color: var(--accent); }

    /* ── Layout ── */
    main { max-width: 1280px; margin: 0 auto; padding: 32px 24px 80px; }

    .toolbar {
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .toolbar h1 { font-size: 1.5rem; font-weight: 700; flex: 1; }
    .toolbar .count { color: var(--muted); font-size: .875rem; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; border-radius: 8px; border: none;
      font-size: .875rem; font-weight: 600; cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--border); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-h); }
    .btn-sm { padding: 6px 12px; font-size: .8rem; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: transform .2s, box-shadow .2s;
      cursor: pointer;
    }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }

    .card-image {
      aspect-ratio: 16/9;
      background: var(--border);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .card-image img {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0;
      transition: opacity .2s;
    }
    .card-image img.loaded { opacity: 1; }
    .card-image .img-placeholder {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; color: var(--muted); font-size: .8rem;
    }
    .card-image .img-placeholder svg { opacity: .4; }

    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .card-title { font-size: 1rem; font-weight: 600; line-height: 1.3; }
    .card-price {
      font-size: 1.1rem; font-weight: 700; color: var(--accent);
      margin-top: 4px;
    }

    .card-actions {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex; gap: 8px;
    }
    .card-actions .btn { flex: 1; justify-content: center; }

    /* ── Empty / Loading ── */
    .state-center {
      grid-column: 1/-1;
      display: flex; flex-direction: column; align-items: center;
      gap: 16px; padding: 80px 0; color: var(--muted);
    }
    .state-center svg { opacity: .3; }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Load more trigger ── */
    #sentinel { height: 1px; }

    /* ── Modal ── */
    .overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.65);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%; max-width: 480px;
      box-shadow: var(--shadow);
      transform: translateY(16px);
      transition: transform .2s;
    }
    .overlay.open .modal { transform: translateY(0); }

    .modal-header {
      padding: 20px 24px 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; }
    .modal-close {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1.25rem; line-height: 1;
      transition: color .15s;
    }
    .modal-close:hover { color: var(--text); }

    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .modal-footer { padding: 0 24px 20px; display: flex; gap: 10px; justify-content: flex-end; }

    /* ── Form ── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .field input, .field textarea {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px;
      color: var(--text); font-size: .9rem; font-family: inherit;
      outline: none; resize: vertical;
      transition: border-color .15s;
    }
    .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .field .hint { font-size: .75rem; color: var(--muted); }
    .field-error { font-size: .75rem; color: var(--danger); }

    /* ── Image upload zone ── */
    .image-slots {
      display: flex; gap: 10px;
    }
    .image-slot {
      flex: 1; aspect-ratio: 1;
      border: 2px dashed var(--border);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .image-slot:hover { border-color: var(--accent); background: rgba(108,99,255,.06); }
    .image-slot input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .image-slot .slot-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--muted); font-size: .72rem; pointer-events: none;
    }
    .image-slot img {
      width: 100%; height: 100%; object-fit: cover;
      display: none;
      pointer-events: none;
    }
    .image-slot img.has-img { display: block; }
    .image-slot .slot-remove {
      position: absolute; top: 4px; right: 4px;
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(0,0,0,.7); border: none; cursor: pointer;
      color: #fff; font-size: .65rem; line-height: 1;
      display: none; align-items: center; justify-content: center;
      z-index: 2;
    }
    .image-slot.filled .slot-remove { display: flex; }
    .image-slot.filled .slot-placeholder { display: none; }
    .image-slot.filled { border-style: solid; border-color: var(--accent); }
    .upload-hint { font-size: .72rem; color: var(--muted); }

    /* ── Toast ── */
    .toasts {
      position: fixed; bottom: 24px; right: 24px; z-index: 500;
      display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    }
    .toast {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 16px;
      font-size: .875rem; max-width: 320px;
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 10px;
      animation: slideIn .25s ease-out;
    }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error   { border-left: 3px solid var(--danger); }
    @keyframes slideIn {
      from { transform: translateX(40px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    .toast.out { animation: slideOut .25s ease-in forwards; }
    @keyframes slideOut {
      to { transform: translateX(40px); opacity: 0; }
    }

    /* ── Detail modal ── */
    .modal-detail {
      max-width: 560px;
    }

    /* ── Carousel ── */
    .carousel {
      position: relative;
      background: var(--bg);
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/9;
      display: flex; align-items: center; justify-content: center;
    }
    .carousel-img {
      width: 100%; height: 100%; object-fit: contain;
      display: none;
    }
    .carousel-img.active { display: block; }
    .carousel-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      color: var(--muted); font-size: .85rem;
    }
    .carousel-placeholder svg { opacity: .3; }
    .carousel-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,.55); border: none; cursor: pointer;
      color: #fff; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
      font-size: 1rem;
    }
    .carousel-btn:hover { background: rgba(0,0,0,.8); }
    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }
    .carousel-btn:disabled { opacity: 0; pointer-events: none; }
    .carousel-counter {
      position: absolute; bottom: 8px; right: 12px;
      font-size: .72rem; color: rgba(255,255,255,.7);
      background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 20px;
    }

    /* ── Detail info ── */
    .detail-price {
      font-size: 1.4rem; font-weight: 700; color: var(--accent);
    }
    .detail-desc {
      font-size: .9rem; color: var(--muted); line-height: 1.6;
      white-space: pre-wrap;
    }
    .detail-meta { font-size: .75rem; color: var(--muted); }
  </style>
</head>
<body>

<header>
  <div class="logo">Pro<span>duct</span>s</div>
  <button class="btn btn-primary" id="btnCreate">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    Новый товар
  </button>
</header>

<main>
  <div class="toolbar">
    <h1>Каталог</h1>
    <span class="count" id="countLabel"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div id="sentinel"></div>
</main>

<!-- Create modal -->
<div class="overlay" id="formOverlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-title">Новый товар</span>
      <button class="modal-close" id="formClose" aria-label="Закрыть">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="fTitle">Название</label>
        <input id="fTitle" type="text" placeholder="Название товара" maxlength="255" />
        <span class="field-error" id="errTitle"></span>
      </div>
      <div class="field">
        <label for="fDesc">Описание</label>
        <textarea id="fDesc" rows="3" placeholder="Описание товара"></textarea>
        <span class="field-error" id="errDesc"></span>
      </div>
      <div class="field">
        <label for="fPrice">Цена (в рублях)</label>
        <input id="fPrice" type="number" min="0.01" step="0.01" placeholder="0.00" />
        <span class="hint">Будет сохранено в копейках</span>
        <span class="field-error" id="errPrice"></span>
      </div>
      <div class="field">
        <label>Фотографии (до 3)</label>
        <div class="image-slots" id="imageSlots">
          <!-- slots rendered by JS -->
        </div>
        <span class="upload-hint">JPEG, PNG или WebP, до 5 МБ каждый</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="formCancel">Отмена</button>
      <button class="btn btn-primary" id="formSubmit">Создать</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal modal-detail" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-title" id="detailTitle"></span>
      <button class="modal-close" id="detailClose" aria-label="Закрыть">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="carousel" id="carousel">
        <div class="carousel-placeholder" id="carouselPlaceholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <span>Фото нет</span>
        </div>
        <button class="carousel-btn prev" id="carouselPrev">&#8249;</button>
        <button class="carousel-btn next" id="carouselNext">&#8250;</button>
        <span class="carousel-counter" id="carouselCounter" style="display:none"></span>
      </div>
      <div class="detail-price" id="detailPrice"></div>
      <div class="detail-desc" id="detailDesc"></div>
      <div class="detail-meta" id="detailMeta"></div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
const API = '/product';
const PAGE_SIZE = 12;

/* ── State ── */
let page = 1;
let loading = false;
let exhausted = false;

/* ── Image slots state ── */
const MAX_IMAGES = 3;
let imageFiles = [null, null, null]; // File | null per slot

/* ── API ── */
async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: opts.body && !(opts.body instanceof FormData)
      ? { 'Content-Type': 'application/json' }
      : {},
    ...opts,
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `HTTP ${res.status}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const getProducts = (p, lim) => apiFetch(`?page=${p}&limit=${lim}`);
const getProduct  = id  => apiFetch(`/${id}`);
const createProduct = data => apiFetch('/', { method: 'POST', body: JSON.stringify(data) });

async function uploadImage(productId, file) {
  const fd = new FormData();
  fd.append('image', file);
  return apiFetch(`/${productId}/image`, { method: 'POST', body: fd });
}

/* ── Helpers ── */
const formatPrice = kopecks => {
  const rubles = kopecks / 100;
  return rubles.toLocaleString('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 2 });
};

const formatDate = iso => new Date(iso).toLocaleDateString('ru-RU', {
  day: '2-digit', month: 'short', year: 'numeric',
});

/* ── Toast ── */
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      ${type === 'success'
        ? '<path d="M3 8l3.5 3.5L13 5" stroke="#4caf82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
        : '<path d="M4 4l8 8M12 4l-8 8" stroke="#e05c6e" stroke-width="2" stroke-linecap="round"/>'}
    </svg>
    <span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    el.addEventListener('animationend', () => el.remove());
  }, 3500);
}

/* ── Card rendering ── */
function cardHTML(p) {
  const firstImg = p.image_urls && p.image_urls.length > 0 ? p.image_urls[0] : null;
  const imgBlock = firstImg
    ? `<img src="${escAttr(firstImg)}" alt="${escAttr(p.title)}" loading="lazy" onload="this.classList.add('loaded')" />`
    : `<div class="img-placeholder">
         <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
           <rect x="3" y="3" width="18" height="18" rx="2"/>
           <circle cx="8.5" cy="8.5" r="1.5"/>
           <path d="M21 15l-5-5L5 21"/>
         </svg>
         <span>Фото скоро</span>
       </div>`;

  return `
    <div class="card" data-id="${escAttr(p.id)}" onclick="openDetail('${escAttr(p.id)}')">
      <div class="card-image">${imgBlock}</div>
      <div class="card-body">
        <div class="card-title">${escHtml(p.title)}</div>
        <div class="card-price">${formatPrice(p.price)}</div>
      </div>
      <div class="card-actions">
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openDetail('${escAttr(p.id)}')">Подробнее</button>
      </div>
    </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

/* ── Load more ── */
async function loadMore() {
  if (loading || exhausted) return;
  loading = true;

  const grid = document.getElementById('grid');

  if (page === 1) {
    grid.innerHTML = `<div class="state-center"><div class="spinner"></div></div>`;
  }

  try {
    const products = await getProducts(page, PAGE_SIZE);

    if (page === 1) grid.innerHTML = '';

    if (!products || products.length === 0) {
      exhausted = true;
      if (page === 1) {
        grid.innerHTML = `
          <div class="state-center">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <path d="M3 6h18M3 12h18M3 18h18"/>
            </svg>
            <span>Товаров пока нет</span>
          </div>`;
      }
      return;
    }

    for (const p of products) {
      grid.insertAdjacentHTML('beforeend', cardHTML(p));
    }

    updateCount();

    if (products.length < PAGE_SIZE) exhausted = true;
    else page++;

  } catch (e) {
    toast(e.message, 'error');
    if (page === 1) grid.innerHTML = '';
  } finally {
    loading = false;
  }
}

function updateCount() {
  const n = document.querySelectorAll('.card').length;
  document.getElementById('countLabel').textContent = n ? `${n} товар${ru(n)}` : '';
}

function ru(n) {
  if (n % 10 === 1 && n % 100 !== 11) return '';
  if (n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14)) return 'а';
  return 'ов';
}

/* ── Infinite scroll ── */
const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) loadMore();
}, { rootMargin: '200px' });
observer.observe(document.getElementById('sentinel'));

/* ── Modal helpers ── */
function openOverlay(id)  { document.getElementById(id).classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }

/* ── Image slots ── */
function renderSlots() {
  const container = document.getElementById('imageSlots');
  container.innerHTML = '';

  for (let i = 0; i < MAX_IMAGES; i++) {
    const file = imageFiles[i];
    const slot = document.createElement('div');
    slot.className = 'image-slot' + (file ? ' filled' : '');
    slot.dataset.idx = i;

    const preview = document.createElement('img');
    preview.alt = '';
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.classList.add('has-img');
    }

    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/jpeg,image/png,image/webp';
    inp.addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      imageFiles[i] = f;
      renderSlots();
    });

    const placeholder = document.createElement('div');
    placeholder.className = 'slot-placeholder';
    placeholder.innerHTML = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <span>Добавить</span>`;

    const removeBtn = document.createElement('button');
    removeBtn.className = 'slot-remove';
    removeBtn.innerHTML = '&#x2715;';
    removeBtn.addEventListener('click', e => {
      e.stopPropagation();
      imageFiles[i] = null;
      renderSlots();
    });

    slot.appendChild(preview);
    slot.appendChild(inp);
    slot.appendChild(placeholder);
    slot.appendChild(removeBtn);
    container.appendChild(slot);
  }
}

function clearImageSlots() {
  imageFiles = [null, null, null];
  renderSlots();
}

/* ── Create ── */
document.getElementById('btnCreate').onclick = () => {
  clearForm();
  clearImageSlots();
  openOverlay('formOverlay');
  document.getElementById('fTitle').focus();
};

function clearForm() {
  ['fTitle','fDesc','fPrice'].forEach(id => document.getElementById(id).value = '');
  ['errTitle','errDesc','errPrice'].forEach(id => document.getElementById(id).textContent = '');
}

function validateForm() {
  let ok = true;
  const title = document.getElementById('fTitle').value.trim();
  const desc  = document.getElementById('fDesc').value.trim();
  const price = parseFloat(document.getElementById('fPrice').value);

  if (!title) { document.getElementById('errTitle').textContent = 'Обязательное поле'; ok = false; }
  if (!desc)  { document.getElementById('errDesc').textContent  = 'Обязательное поле'; ok = false; }
  if (!price || price <= 0) { document.getElementById('errPrice').textContent = 'Укажите положительную цену'; ok = false; }
  return ok;
}

document.getElementById('formSubmit').onclick = async () => {
  if (!validateForm()) return;

  const title = document.getElementById('fTitle').value.trim();
  const description = document.getElementById('fDesc').value.trim();
  const price = Math.round(parseFloat(document.getElementById('fPrice').value) * 100);

  const btn = document.getElementById('formSubmit');
  btn.disabled = true;

  try {
    btn.textContent = 'Создание товара…';
    const { id } = await createProduct({ title, description, price });

    const filesToUpload = imageFiles.filter(Boolean);
    for (let i = 0; i < filesToUpload.length; i++) {
      btn.textContent = `Загрузка фото ${i + 1}/${filesToUpload.length}…`;
      try {
        await uploadImage(id, filesToUpload[i]);
      } catch (imgErr) {
        toast(`Фото ${i + 1} не загрузилось: ${imgErr.message}`, 'error');
      }
    }

    toast('Товар создан');
    closeOverlay('formOverlay');
    resetAndReload();
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Создать';
  }
};

['formClose','formCancel'].forEach(id =>
  document.getElementById(id).onclick = () => closeOverlay('formOverlay'));

/* ── Detail view ── */
let carouselImages = [];
let carouselIndex = 0;

async function openDetail(id) {
  openOverlay('detailOverlay');
  document.getElementById('detailTitle').textContent = '';
  document.getElementById('detailPrice').textContent = '';
  document.getElementById('detailDesc').textContent = '';
  document.getElementById('detailMeta').textContent = '';
  resetCarousel([]);

  try {
    const p = await getProduct(id);
    document.getElementById('detailTitle').textContent = p.title;
    document.getElementById('detailPrice').textContent = formatPrice(p.price);
    document.getElementById('detailDesc').textContent = p.description;
    document.getElementById('detailMeta').textContent = `Обновлён ${formatDate(p.updated_at)}`;
    resetCarousel(p.image_urls || []);
  } catch (e) {
    toast(e.message, 'error');
    closeOverlay('detailOverlay');
  }
}

function resetCarousel(urls) {
  carouselImages = urls;
  carouselIndex = 0;

  const carousel = document.getElementById('carousel');
  carousel.querySelectorAll('.carousel-img').forEach(el => el.remove());

  const placeholder = document.getElementById('carouselPlaceholder');
  const counter = document.getElementById('carouselCounter');

  if (urls.length === 0) {
    placeholder.style.display = '';
    counter.style.display = 'none';
    document.getElementById('carouselPrev').disabled = true;
    document.getElementById('carouselNext').disabled = true;
    return;
  }

  placeholder.style.display = 'none';

  for (let i = 0; i < urls.length; i++) {
    const img = document.createElement('img');
    img.className = 'carousel-img' + (i === 0 ? ' active' : '');
    img.src = urls[i];
    img.alt = '';
    carousel.insertBefore(img, document.getElementById('carouselPrev'));
  }

  updateCarousel();
}

function updateCarousel() {
  const imgs = document.querySelectorAll('#carousel .carousel-img');
  imgs.forEach((img, i) => img.classList.toggle('active', i === carouselIndex));

  const counter = document.getElementById('carouselCounter');
  if (carouselImages.length > 1) {
    counter.style.display = '';
    counter.textContent = `${carouselIndex + 1} / ${carouselImages.length}`;
  } else {
    counter.style.display = 'none';
  }

  document.getElementById('carouselPrev').disabled = carouselIndex === 0;
  document.getElementById('carouselNext').disabled = carouselIndex === carouselImages.length - 1;
}

document.getElementById('carouselPrev').onclick = () => {
  if (carouselIndex > 0) { carouselIndex--; updateCarousel(); }
};
document.getElementById('carouselNext').onclick = () => {
  if (carouselIndex < carouselImages.length - 1) { carouselIndex++; updateCarousel(); }
};

document.getElementById('detailClose').onclick = () => closeOverlay('detailOverlay');

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeOverlay('formOverlay');
    closeOverlay('detailOverlay');
  }
  if (e.key === 'ArrowLeft' && document.getElementById('detailOverlay').classList.contains('open')) {
    if (carouselIndex > 0) { carouselIndex--; updateCarousel(); }
  }
  if (e.key === 'ArrowRight' && document.getElementById('detailOverlay').classList.contains('open')) {
    if (carouselIndex < carouselImages.length - 1) { carouselIndex++; updateCarousel(); }
  }
});

/* ── Overlay backdrop click ── */
['formOverlay','detailOverlay'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target === e.currentTarget) closeOverlay(id);
  });
});

/* ── Reset & reload ── */
function resetAndReload() {
  page = 1;
  exhausted = false;
  document.getElementById('grid').innerHTML = '';
  loadMore();
}

/* Enter to submit form */
document.getElementById('formOverlay').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
    document.getElementById('formSubmit').click();
  }
});

/* ── Init ── */
renderSlots();
</script>
</body>
